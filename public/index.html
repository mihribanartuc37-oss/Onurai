<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onur AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 64px;
      background: #171a23;
      border-bottom: 1px solid #292d38;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      flex-shrink: 0;
    }

    #menuButton {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    #menuButton:active {
      background: #242936;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: #242936;
      border-bottom-left-radius: 4px;
    }

    #inputArea {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #171a23;
      border-top: 1px solid #292d38;
    }

    #plusButton {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: #242936;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    #plusButton:active {
      transform: scale(0.96);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #242936;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #modeMenu {
      position: absolute;
      left: 10px;
      bottom: 68px;
      width: 235px;
      background: #1b1f29;
      border: 1px solid #343947;
      border-radius: 14px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 50;
    }

    #modeMenu.open {
      display: flex;
    }

    .modeButton {
      width: 100%;
      min-height: 45px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: white;
      text-align: left;
      padding: 10px 12px;
      font-size: 15px;
      cursor: pointer;
    }

    .modeButton:hover {
      background: #292e3a;
    }

    .modeButton:active {
      background: #333947;
    }

    #selectedMode {
      position: absolute;
      left: 10px;
      bottom: 68px;
      transform: translateY(-255px);
      background: #2563eb;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      display: none;
      z-index: 49;
    }

    #statusText {
      position: absolute;
      left: 68px;
      bottom: 62px;
      color: #9ca3af;
      font-size: 13px;
      display: none;
      z-index: 40;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 20;
    }

    #overlay.active {
      display: block;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 285px;
      height: 100%;
      background: #171a23;
      border-right: 1px solid #292d38;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }

    #sidebar.open {
      transform: translateX(0);
    }

    .sidebarTop {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #292d38;
      flex-shrink: 0;
    }

    .sidebarTitle {
      font-size: 20px;
      font-weight: bold;
    }

    #closeButton {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    #closeButton:active {
      background: #242936;
    }

    #newChatButton {
      margin: 14px;
      height: 48px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #newChatButton:active {
      transform: scale(0.98);
    }

    #chatList {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 15px;
    }

    .chatItem {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: white;
      text-align: left;
      padding: 12px;
      margin-bottom: 4px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .chatItem:hover {
      background: #242936;
    }

    .chatItem.active {
      background: #242936;
    }

    .emptyChats {
      color: #8f96a8;
      text-align: center;
      padding: 20px 10px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      #sidebar {
        width: 82%;
        max-width: 300px;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <button id="menuButton" aria-label="Menüyü aç">☰</button>
    <div class="logo">Onur AI</div>
  </header>

  <div id="chat"></div>

  <div id="inputArea">

    <div id="modeMenu">

      <button class="modeButton" data-mode="Görsel oluştur">
        🖼️ Görsel oluştur
      </button>

      <button class="modeButton" data-mode="Araştır">
        🔎 Araştır
      </button>

      <button class="modeButton" data-mode="Ders çalıştır">
        📚 Ders çalıştır
      </button>

      <button class="modeButton" data-mode="Derin düşün">
        🧠 Derin düşün
      </button>

      <button class="modeButton" data-mode="Düşün">
        💭 Düşün
      </button>

      <button class="modeButton" data-mode="Oyun yap">
        🎮 Oyun yap
      </button>

    </div>

    <div id="statusText"></div>

    <button id="plusButton" aria-label="Özellikler">
      +
    </button>

    <input
      id="messageInput"
      type="text"
      autocomplete="off"
      placeholder="Mesaj yaz..."
    >

    <button id="sendButton">
      Gönder
    </button>

  </div>

  <div id="overlay"></div>

  <aside id="sidebar">

    <div class="sidebarTop">

      <div class="sidebarTitle">
        Onur AI
      </div>

      <button
        id="closeButton"
        aria-label="Menüyü kapat"
      >
        ×
      </button>

    </div>

    <button id="newChatButton">
      ＋ Yeni sohbet
    </button>

    <div id="chatList">

      <div class="emptyChats">
        Henüz sohbet yok.
      </div>

    </div>

  </aside>

  <script>
    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const plusButton =
      document.getElementById(
        "plusButton"
      );

    const modeMenu =
      document.getElementById(
        "modeMenu"
      );

    const statusText =
      document.getElementById(
        "statusText"
      );

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const closeButton =
      document.getElementById(
        "closeButton"
      );

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const overlay =
      document.getElementById(
        "overlay"
      );

    const newChatButton =
      document.getElementById(
        "newChatButton"
      );

    const chatList =
      document.getElementById(
        "chatList"
      );

    const modeButtons =
      document.querySelectorAll(
        ".modeButton"
      );

    const MAX_CHATS = 1000000;

    let chats = [];
    let currentChat = null;
    let chatNumber = 0;

    let selectedMode = "Düşün";

    function saveChats() {
      try {
        localStorage.setItem(
          "onurAI_chats",
          JSON.stringify(chats)
        );

        localStorage.setItem(
          "onurAI_chatNumber",
          String(chatNumber)
        );
      } catch (error) {
        console.error(
          "Sohbetler kaydedilemedi:",
          error
        );
      }
    }

    function loadChats() {
      try {
        const savedChats =
          localStorage.getItem(
            "onurAI_chats"
          );

        const savedNumber =
          localStorage.getItem(
            "onurAI_chatNumber"
          );

        if (savedChats) {
          const parsed =
            JSON.parse(savedChats);

          if (Array.isArray(parsed)) {
            chats = parsed;
          }
        }

        if (savedNumber) {
          chatNumber =
            Number(savedNumber) || 0;
        }

        if (chats.length > 0) {
          const highestNumber =
            chats.reduce(
              (highest, item) => {

                const match =
                  String(
                    item.title
                  ).match(
                    /^Sohbet (\d+)$/
                  );

                if (!match) {
                  return highest;
                }

                return Math.max(
                  highest,
                  Number(match[1])
                );
              },
              0
            );

          chatNumber =
            Math.max(
              chatNumber,
              highestNumber
            );
        }

      } catch (error) {
        console.error(
          "Sohbetler yüklenemedi:",
          error
        );

        chats = [];
        chatNumber = 0;
      }
    }

    function createChat() {

      if (
        chatNumber >=
        MAX_CHATS
      ) {
        alert(
          "Sohbet sınırına ulaşıldı."
        );

        return;
      }

      chatNumber++;

      const newChat = {
        id:
          Date.now().toString() +
          Math.random()
            .toString(36)
            .substring(2),

        title:
          "Sohbet " +
          chatNumber,

        messages: []
      };

      chats.unshift(newChat);

      currentChat = newChat;

      saveChats();

      renderChatList();
      renderMessages();

      closeSidebar();

      input.focus();
    }

    function renderChatList() {

      chatList.innerHTML = "";

      if (chats.length === 0) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "emptyChats";

        empty.textContent =
          "Henüz sohbet yok.";

        chatList.appendChild(
          empty
        );

        return;
      }

      chats.forEach((item) => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "chatItem";

        if (
          currentChat &&
          currentChat.id ===
            item.id
        ) {
          button.classList.add(
            "active"
          );
        }

        button.textContent =
          item.title;

        button.addEventListener(
          "click",
          function() {

            currentChat = item;

            renderMessages();
            renderChatList();

            closeSidebar();

            input.focus();
          }
        );

        chatList.appendChild(
          button
        );
      });
    }

    function renderMessages() {

      chat.innerHTML = "";

      if (!currentChat) {
        return;
      }

      currentChat.messages.forEach(
        (message) => {

          addMessage(
            message.text,
            message.type,
            false
          );

        }
      );

      chat.scrollTop =
        chat.scrollHeight;
    }

    function addMessage(
      text,
      type,
      save = true
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;

      message.textContent =
        text;

      chat.appendChild(
        message
      );

      chat.scrollTop =
        chat.scrollHeight;

      if (
        save &&
        currentChat
      ) {

        currentChat.messages.push({
          text: text,
          type: type
        });

        saveChats();
      }
    }

    function getStatus(mode) {

      if (
        mode ===
        "Görsel oluştur"
      ) {
        return "Görsel oluşturuluyor...";
      }

      if (
        mode === "Araştır"
      ) {
        return "Araştırılıyor...";
      }

      if (
        mode ===
        "Ders çalıştır"
      ) {
        return "Ders hazırlanıyor...";
      }

      if (
        mode ===
        "Derin düşün"
      ) {
        return "Derin düşünülüyor...";
      }

      if (
        mode === "Düşün"
      ) {
        return "Düşünüyor...";
      }

      if (
        mode === "Oyun yap"
      ) {
        return "Oyun geliştiriliyor...";
      }

      return "Onur AI düşünüyor...";
    }

    function setMode(mode) {

      selectedMode = mode;

      modeMenu.classList.remove(
        "open"
      );

      plusButton.textContent =
        "+";

      input.focus();
    }

    plusButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        modeMenu.classList.toggle(
          "open"
        );
      }
    );

    modeButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          function() {

            const mode =
              button.dataset.mode;

            setMode(mode);
          }
        );

      }
    );

    document.addEventListener(
      "click",
      function(event) {

        if (
          !modeMenu.contains(
            event.target
          ) &&
          event.target !==
            plusButton
        ) {
          modeMenu.classList.remove(
            "open"
          );
        }

      }
    );

    async function sendMessage() {

      const text =
        input.value.trim();

      if (
        !text ||
        sendButton.disabled
      ) {
        return;
      }

      if (!currentChat) {
        createChat();
      }

      addMessage(
        text,
        "user"
      );

      input.value = "";

      sendButton.disabled =
        true;

      plusButton.disabled =
        true;

      statusText.textContent =
        getStatus(
          selectedMode
        );

      statusText.style.display =
        "block";

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text,
                mode: selectedMode,
                provider:
                  "huggingface"
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Sunucu hatası."
          );
        }

        addMessage(
          data.answer ||
          data.reply ||
          "Onur AI cevap vermedi.",
          "ai"
        );

      } catch (error) {

        console.error(
          "Onur AI hatası:",
          error
        );

        addMessage(
          "Onur AI bağlantısında hata oluştu: " +
          error.message,
          "ai"
        );

      } finally {

        sendButton.disabled =
          false;

        plusButton.disabled =
          false;

        statusText.style.display =
          "none";

        input.focus();
      }
    }

    function openSidebar() {

      sidebar.classList.add(
        "open"
      );

      overlay.classList.add(
        "active"
      );

      renderChatList();
    }

    function closeSidebar() {

      sidebar.classList.remove(
        "open"
      );

      overlay.classList.remove(
        "active"
      );
    }

    menuButton.addEventListener(
      "click",
      openSidebar
    );

    closeButton.addEventListener(
      "click",
      closeSidebar
    );

    overlay.addEventListener(
      "click",
      closeSidebar
    );

    newChatButton.addEventListener(
      "click",
      createChat
    );

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {
          sendMessage();
        }

      }
    );

    loadChats();

    if (chats.length > 0) {
      currentChat = chats[0];
      renderMessages();
    }

    renderChatList();

    input.focus();
  </script>

</body>
      </html>
